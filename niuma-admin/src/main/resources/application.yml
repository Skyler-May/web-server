# 项目相关配置
ruoyi:
  # 名称
  name: RuoYi
  # 版本
  version: 3.8.8
  # 版权年份
  copyrightYear: 2024
  # 文件路径 示例（ Windows配置D:/ruoyi/uploadPath，Linux配置 /home/ruoyi/uploadPath）
  profile: /home/wujian/niuma/ruoyi/upload
  # 获取ip地址开关
  addressEnabled: false
  # 验证码类型 math 数字计算 char 字符验证
  captchaType: math

# 开发环境配置
server:
  # 服务器的HTTP端口，默认为8080
  port: 18080
  servlet:
    # 应用的访问路径
    context-path: /
  tomcat:
    # tomcat的URI编码
    uri-encoding: UTF-8
    # 连接数满后的排队数，默认为100
    accept-count: 1000
    threads:
      # tomcat最大线程数，默认为200
      max: 800
      # Tomcat启动初始化的线程数，默认值10
      min-spare: 100

# 用户配置
user:
  password:
    # 密码最大错误次数
    maxRetryCount: 5
    # 密码锁定时间（默认10分钟）
    lockTime: 10

# Spring配置
spring:
  # 资源信息
  messages:
    # 国际化资源文件路径
    basename: i18n/messages
  profiles:
    active: druid
  # 文件上传
  servlet:
    multipart:
      # 单个文件大小
      max-file-size: 10MB
      # 设置总上传的文件大小
      max-request-size: 20MB
  # 服务模块
  devtools:
    restart:
      # 热部署开关
      enabled: true

# token配置
token:
  # 令牌自定义标识
  header: Authorization
  # 令牌密钥
  secret: abcdefghijklmnopqrstuvwxyz
  # 令牌有效期（默认30分钟）
  expireTime: 30

# MyBatis配置
#mybatis:
  # 配置mapper的扫描，找到所有的mapper.xml映射文件
  #mapperLocations: classpath*:mapper/**/*Mapper.xml
  # 加载全局的配置文件
  #configLocation: classpath:mybatis/mybatis-config.xml

mybatis-plus:
  # 配置mapper的扫描，找到所有的mapper.xml映射文件
  mapperLocations: classpath*:mapper/**/*Mapper.xml
  # 加载全局的配置文件
  configLocation: classpath:mybatis/mybatis-config.xml

# PageHelper分页插件
pagehelper:
  helperDialect: mysql
  supportMethodsArguments: true
  params: count=countSql

# Swagger配置
swagger:
  # 是否开启swagger
  enabled: true
  # 请求前缀
  pathMapping: /dev-api

# 防止XSS攻击
xss:
  # 过滤开关
  enabled: true
  # 排除链接（多个用逗号分隔）
  excludes: /system/notice
  # 匹配链接
  urlPatterns: /system/*,/monitor/*,/tool/*

# ============================================================
# 厂商接入（标准厂商 API 模式）
# ------------------------------------------------------------
# 默认关闭：关闭时 NiuMa 与原版完全一致，可独立运行/独立售卖。
# 开启后额外暴露 {api-prefix}/catalog、/launch、/health 接口，
# 供聚合平台（如 gaming-server）以标准厂商方式接入。
#
# 开启方式（生产环境建议用环境变量或外部配置覆盖，勿提交密钥）：
#   niuma.vendor.enabled=true
#   niuma.vendor.apps[0].app-id=gaming
#   niuma.vendor.apps[0].app-secret=<强随机密钥>
# ============================================================
niuma:
  vendor:
    # 是否启用厂商接入模式；false = 原版行为，厂商接口不可用
    # 本地 H5/Expo 联调时设为 true
    enabled: true
    # 厂商 API 路径前缀
    api-prefix: /vendor
    # 签名有效期（秒），超出视为过期请求
    sign-ttl-seconds: 300
    # 结算回调窗口（秒）
    settle-window-seconds: 3600
    # 结算扫描任务开关（后续实现逐局回调时启用）
    settle-job-enabled: true
    settle-job-interval-ms: 30000
    # H5 客户端基础地址（聚合平台免登录直达用）
    # 必须是**客户端可访问**的地址：
    #   本机浏览器调试 → http://127.0.0.1:8088/index.html
    #   手机/Expo 调试  → http://<局域网IP>:8088/index.html
    #   生产           → https://h5.域名/index.html
    # 留空则 launch 不返回 launchUrl，聚合端需自行拼装
    h5-base-url: http://192.168.3.83:8088/index.html
    # 已授权的接入方列表
    # 注意：app-secret 生产环境必须改为强密钥，这里仅供本地联调
    apps:
      - app-id: gaming
        app-secret: test-secret-12345
        name: Gaming
        settle-callback-url: http://127.0.0.1:8080/api/v1/vendor/callback/settle
        enabled: true
